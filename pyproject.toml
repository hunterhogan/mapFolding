# path-sync copy -n hunterhogan
[project]
name = "mapFolding"
version = "0.40.1"
description = "Map folding, meanders, stamp folding, semi-meanders. Experiment with algorithm transformations, and analyze computational states."
readme = "README.md"
requires-python = ">=3.14"
license = "CC-BY-NC-4.0"
license-files = ["LICEN[CS]E*"]
authors = [{ name = "Hunter Hogan", email = "HunterHogan@pm.me" }]
maintainers = [{ name = "Hunter Hogan", email = "HunterHogan@pm.me" }]
keywords = [
  "A001415",
  "A400429",
  "OEIS",
  "combinatorial geometry",
  "combinatorics",
  "computational combinatorics",
  "computational geometry",
  "map folding",
  "meanders",
  "stamp folding",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
scripts = { OEIS_for_n = "mapFolding.oeis:OEIS_for_n", getOEISids = "mapFolding.oeis:getOEISids" }
dependencies = [
  "Z0Z_tools>=4.1.2",
  "anyascii",
  "astToolkit>=0.14.2",
  "gmpy2",
  "hunterMakesPy>=0.10.1",
  "more_itertools",
  "numba",
  "numba_progress",
  "numpy",
  "oeis-tools",
  "platformdirs",
  "sympy",
  "tqdm",
  "typing_extensions>=4.16.0",
]
optional-dependencies = { codon = ["codon-jit>=0.4.6; sys_platform == 'linux'", "lief; sys_platform == 'linux'"], oeisdata = ["dulwich>=1.2.21"], ortools = ["ortools"], pandas = ["pandas", "pyarrow"], polars = ["polars>=1.44.2"] }

[project.urls]
Context7 = "https://context7.com/hunterhogan/mapfolding"
Documentation = "https://github.com/hunterhogan/mapFolding/blob/main/mapFolding/_semiotics.md"
Donate = "https://www.patreon.com/integrated"
Download = "https://pypi.org/project/mapFolding"
Homepage = "https://github.com/hunterhogan/mapFolding"
Issues = "https://github.com/hunterhogan/mapFolding/issues"
Repository = "https://github.com/hunterhogan/mapFolding.git"

[dependency-groups]
development = ["gmpy2-stubs", "google-api-python-client-stubs>=1.35.0", "ipykernel", "ipywidgets", "matplotlib", "memray; sys_platform == 'linux'", "mpmath>=1.4.0", "networkx", "pandas-stubs", "py-spy", "pyarrow-stubs", "pytest-cov", "setuptools", "types-networkx", "types-tqdm"]
testing = ["dulwich", "hypothesis", "ortools", "pandas", "polars>=1.44.2", "pyarrow", "pytest>=9.0", "pytest-env", "pytest-xdist"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.coverage]
report = { exclude_also = [
  "@overload",
  "^\\s*\\.\\.\\.$",
  "if TYPE_CHECKING:",
  "if __name__ == \"__main__\":",
  "numba.jit_module",
], ignore_errors = false }
run = { branch = true, concurrency = ["multiprocessing"], data_file = "mapFolding/tests/coverage/.coverage", omit = [
  "**/archive/**",
  "**/development/**",
  "**/easyRun/**",
  "**/*research/**",
  "**/tests/**",
  "getLLVMforNoReason.py",
  "mapFolding/algorithms/foldsSymmetric.py",
  "**/Z0Z_*",
], parallel = true, source = ["."] }

# === DO_NOT_EDIT: path-sync hunterhogan ===
[tool.isort]
add_imports = ["from __future__ import annotations"]
append_only = true
atomic = true
combine_as_imports = true
extend_skip_glob = ["*.pyi"]
filter_files = true
force_alphabetical_sort_within_sections = true
from_first = true
honor_noqa = true
indent = "\t"
line_length = 140
lines_after_imports = 1
lines_between_types = 0
multi_line_output = 4
no_sections = true
skip_gitignore = true
use_parentheses = true
# === OK_EDIT: path-sync hunterhogan ===

# === DO_NOT_EDIT: path-sync hunterhogan ===
[tool.pyrefly]
enabled-ignores = ["pyrefly"]
# ignore-errors-in-generated-code = true
infer-with-first-use = false
preset = "strict"
python-platform = "all"
# === OK_EDIT: path-sync hunterhogan ===

project-excludes = ["archive/**"]

# === DO_NOT_EDIT: path-sync hunterhogan ===
[tool.pyrefly.errors]
bad-return = "warn"
invalid-yield = "warn"
# === OK_EDIT: path-sync hunterhogan ===

[tool.pytest]
addopts = ["--color=yes", "-n", "3"]
empty_parameter_set_mark = "fail_at_collect"
filterwarnings = ["error"]
log_auto_indent = "On"
minversion = "9.0"
strict = true
testpaths = ["mapFolding/tests"]

[tool.pytest_env]
# Re-confirmed: numba Version: 0.63.1 2025 December 30
NUMBA_JIT_COVERAGE = "1"  # This does not work, whether it is 0 or 1.
# NUMBA_DISABLE_JIT = "1" # This is the only way to get coverage data

# === DO_NOT_EDIT: path-sync hunterhogan ===
[tool.ruff]
line-length = 140
# === OK_EDIT: path-sync hunterhogan ===

extend-exclude = ["archive"]

# === DO_NOT_EDIT: path-sync hunterhogan ===
[tool.ruff.lint]
allowed-confusables = ["–", "’", "′", "×", "−", "∖", "∗", "∣", "∨", "∪", "∼", "⊗", "ℂ", "ℋ", "ℒ", "ℓ", "ℕ", "ℙ", "ℚ", "ℝ", "ℤ", "ℰ", "ℱ", "𝒪", "𝒮", "𝔼", "𝕀", "𝟙", "α", "Β", "γ", "ι", "Κ", "ν", "ο", "ρ", "σ"]
future-annotations = true
ignore = [
  # ====== Linters ===========
  "FIX",  # flake8-fixme
  "I",  # isort
  "N",  # pep8-naming
  "TD",  # flake8-todos
  # ====== complexity ========
  "dict-index-missing-items",
  "explicit-f-string-type-conversion",
  "non-pep695-type-alias",
  "redundant-numeric-union",
  "static-join-to-f-string",
  "unnecessary-literal-dict",
  "useless-import-alias",
  # ====== correctness =======
  "unused-variable",
  # ====== formatting ========
  "bad-quotes-inline-string",
  "blank-lines-after-function-or-class",
  "blank-lines-top-level",
  "docstring-tab-indentation",
  "incorrect-blank-line-after-class",
  "line-too-long",
  "missing-newline-at-end-of-file",
  "missing-trailing-comma",
  "no-space-after-block-comment",
  "tab-indentation",
  "too-many-blank-lines",
  # ====== pedantic ==========
  "any-type",
  "blanket-noqa",
  "docstring-in-stub",
  "docstring-missing-exception",
  "docstring-missing-returns",
  "docstring-missing-yields",
  "if-else-block-instead-of-if-exp",
  "incorrect-section-order",
  "magic-value-comparison",
  "missing-copyright-notice",
  "missing-trailing-period",
  "non-ascii-import-name",
  "non-ascii-name",
  "non-imperative-mood",
  "redefined-loop-name",
  "superfluous-else-continue",
  "superfluous-else-return",
  "too-many-arguments",
  "too-many-branches",
  "too-many-locals",
  "too-many-nested-blocks",
  "too-many-positional-arguments",
  "too-many-public-methods",
  "too-many-statements",
  "typed-argument-default-in-stub",
  "yoda-conditions",
  # ====== restriction =======
  "complex-structure",
  # ====== security ==========
  "subprocess-without-shell-equals-true",
  "suspicious-pickle-import",
  # ====== style =============
  "snake-case-type-alias",
  "type-name-incorrect-variance",
  # ====== suspicious ========
  "self-or-cls-assignment",
  "subclass-builtin",
  "unused-import",
  "useless-else-on-loop",
]
preview = true
select = ["ALL"]
extend-select = ["missing-terminal-punctuation", "undocumented-param", "undocumented-public-init"]
task-tags = ["DEVELOPMENT", "FailEarly", "NOTE", "SEMIOTICS", "TODO"]
# === OK_EDIT: path-sync hunterhogan ===

